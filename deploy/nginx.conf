# The Edge: the only origin a browser sees.
#
# It serves the built front end and routes /api to the BFF. The Middleware and
# the vendor mock are not reachable through it, and publish no ports of their
# own, so the browser cannot reach them at all.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # TLS terminates here in a deployed environment. Locally this is plain HTTP;
    # see Branding and Security in design/assumptions.md.

    # The front end loads its own assets and one font stylesheet, and talks only
    # to its own origin. Anything else is a mistake worth failing loudly.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;

    server_tokens off;

    location /api/ {
        proxy_pass       http://cqapp-bff:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A correlation id from the browser passes through untouched, so one
        # request is one id across every service.
        proxy_set_header X-Correlation-Id  $http_x_correlation_id;

        # Longer than the BFF's own budget, so the BFF reports the specific
        # failure rather than nginx reporting a generic timeout.
        proxy_read_timeout 30s;
    }

    # Hashed assets never change, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A single page app: any path that is not a file is the app itself, so a
    # deep link or a refresh lands on the application rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
