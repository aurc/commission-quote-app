<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; background: #f6f2f5; color: #212529;
           font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; }
    a { color: #870e40; } a:hover { color: #58003a; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="min-height: 100%; display: flex; flex-direction: column;">
  <header style="height: 64px; padding: 0 32px; background: #870e40; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
        <circle cx="7.5" cy="7.5" r="3.25"></circle>
        <circle cx="16.5" cy="16.5" r="3.25"></circle>
        <line x1="18.5" y1="5.5" x2="5.5" y2="18.5"></line>
      </svg>
        <span style="font-size: 17px; font-weight: 600; color: #ffffff;">Commission Quote</span>
      </div>
      
  </header>
  <main style="flex-grow: 1; padding: 40px 32px 48px; display: flex; justify-content: center;">
    <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 20px;">
      <div style="background: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; padding: 28px;">
        <h1 style="margin: 0 0 4px; font-size: 24px; font-weight: 600; line-height: 1.25;">Sign in</h1>
        <p style="margin: 0 0 20px; font-size: 15px; line-height: 1.5; color: #68696b;">Commission quotes for lending staff.</p>
        <div style="display: flex; gap: 10px; padding: 14px 16px; margin-bottom: 20px; border: 1px solid #b20838; border-radius: 6px; background: #ffffff;">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#b20838" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px;" aria-hidden="true"><path d="M8 2.5 14.5 13.5H1.5Z"></path><line x1="8" y1="6.4" x2="8" y2="9.4"></line><circle cx="8" cy="11.6" r="0.6" fill="#b20838" stroke="none"></circle></svg>
          <div>
            <div style="font-size: 15px; font-weight: 500; color: #b20838; line-height: 1.4;">That staff ID or password is not correct.</div>
            <div style="font-size: 13px; color: #68696b; margin-top: 4px; line-height: 1.45;">Check both and try again.</div>
            <div style="display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-top: 10px;"><span style="font-size: 13px; color: #68696b;">Reference</span><span style="font: 400 14px 'IBM Plex Mono', monospace; color: #212529;">05f2077a1e6e8e3a</span><span style="font-size: 13px; color: #68696b;">quote this if you contact support</span></div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 18px;">
        <div>
          <label style="display: block; font: 500 14px 'IBM Plex Sans', sans-serif; color: #212529; margin-bottom: 6px;">Staff ID</label>
          <input value="staff-001" style="width: 100%; height: 44px; padding: 0 12px; border: 1px solid #dee2e6; border-radius: 6px; background: #ffffff; color: #212529; font: 400 16px 'IBM Plex Sans', sans-serif;">
        </div>
        <div>
          <label style="display: block; font: 500 14px 'IBM Plex Sans', sans-serif; color: #212529; margin-bottom: 6px;">Password</label>
          <input value="•••••••" style="width: 100%; height: 44px; padding: 0 12px; border: 1px solid #dee2e6; border-radius: 6px; background: #ffffff; color: #212529; font: 400 16px 'IBM Plex Sans', sans-serif;">
        </div>
          <button style="width: 100%; height: 48px; border: none; border-radius: 6px; background: #870e40; color: #ffffff; font: 600 16px 'IBM Plex Sans', sans-serif;">Sign in</button>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
