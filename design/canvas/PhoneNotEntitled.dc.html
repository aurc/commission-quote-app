<!doctype html>
<html>
<head>

<body>
<x-dc>
<helmet>

  <style>
    body { margin: 0; background: #f6f2f5; color: #212529;

    a { color: #870e40; } a:hover { color: #58003a; }

</helmet>

<div style="min-height: 100%; display: flex; flex-direction: column;">
  <header style="height: 64px; padding: 0 16px; background: #870e40; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 12px;">

        <circle cx="7.5" cy="7.5" r="3.25"></circle>
        <circle cx="16.5" cy="16.5" r="3.25"></circle>
        <line x1="18.5" y1="5.5" x2="5.5" y2="18.5"></line>
      </svg>
        <span style="font-size: 17px; font-weight: 600; color: #ffffff;">Commission Quote</span>
      </div>
      <div style="display: flex; align-items: center; gap: 16px;"><button style="height: 36px; padding: 0 14px; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 6px; background: transparent; color: #ffffff; font: 500 14px 'IBM Plex Sans', sans-serif;">Sign out</button></div>
  </header>
  <main style="flex-grow: 1; padding: 20px 16px 32px; display: flex; justify-content: center;">
    <div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 20px;">
      <div style="background: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px;">
        <div style="display: flex; gap: 12px;">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#870e40" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px;" aria-hidden="true">
            <rect x="4" y="9" width="12" height="8" rx="1.5"></rect><path d="M7 9V6.5a3 3 0 0 1 6 0V9"></path>
          </svg>
          <div>
            <h1 style="margin: 0 0 6px; font-size: 20px; font-weight: 600; line-height: 1.3;">You do not have access to generate quotes.</h1>
            <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #68696b;">
              You are signed in, so signing in again will not help. Ask your manager to have quote access added to your profile.
            </p>
            <div style="display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid #dee2e6;"><span style="font-size: 13px; color: #68696b;">Reference</span><span style="font: 400 14px 'IBM Plex Mono', monospace; color: #212529;">2071b1bf66a4678d</span><span style="font-size: 13px; color: #68696b;">quote this if you contact support</span></div>
          </div>
        </div>
      </div>
    </div>

</div>
