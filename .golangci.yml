version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        # Timeouts and TLS are terminated at the Edge; budgets live in httpx.
        - G114
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - gosec

formatters:
  enable:
    - gofmt
